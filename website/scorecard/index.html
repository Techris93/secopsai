<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontier scorecard — SecOpsAI</title>
    <meta name="description" content="SecOpsAI's pre-registered detection targets and how each one measures today: held-out recall, false positives, live registry coverage and verdict speed.">
    <link rel="canonical" href="https://secopsai.dev/scorecard/">
    <link rel="icon" type="image/png" href="/assets/favicon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <script src="/assets/scorecard.js" defer></script>
    <style>
        :root {
            --paper: #FBFAF6; --panel: #FFFFFF; --ink: #16191D; --ink-2: #3E4650; --muted: #67707B;
            --rule: #C9CDD2; --rule-dark: #9BA2AA; --note: #0F4C81;
            --warning: #9E1B1B; --warning-bg: #FAECEC; --ok: #1E6B3A; --ok-bg: #EBF4EE;
            --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background: var(--paper); color: var(--ink); line-height: 1.55; font-size: 15px; }
        a { color: var(--note); }
        .page { max-width: 880px; margin: 0 auto; padding: 0 16px 96px; }
        .doc-header { border-bottom: 2px solid var(--ink); padding: 18px 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
        .wordmark { font-weight: 700; font-size: 18px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 10px; }
        .wordmark img { width: 26px; height: 26px; border-radius: 6px; display: block; }
        .doc-nav { display: flex; gap: 20px; font-size: 12px; flex-wrap: wrap; }
        .doc-nav a { color: var(--ink-2); text-decoration: none; }
        .doc-nav a:hover { color: var(--note); }
        h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; margin: 32px 0 16px; }
        .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border: 1px solid var(--rule-dark); background: var(--panel); }
        .meta div { padding: 10px 14px; border-right: 1px solid var(--rule); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
        .meta div:last-child { border-right: 0; }
        .key { font-size: 10px; color: var(--muted); display: block; margin-bottom: 3px; }
        .meta strong { font-size: 20px; }
        section { margin-top: 40px; }
        h2 { font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--rule-dark); padding-bottom: 8px; margin-bottom: 12px; }
        h2 .id { font-family: var(--mono); color: var(--muted); font-weight: 500; margin-right: 8px; }
        .table-wrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--panel); }
        table { width: 100%; border-collapse: collapse; font-size: 13.5px; table-layout: fixed; }
        th:first-child, td:first-child { width: 46%; }
        th:nth-child(n+2):not(:last-child) { width: 14%; }
        th:last-child { width: 12%; }
        th { font-size: 10px; color: var(--muted); text-align: left; font-weight: 500; }
        th, td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
        tr:last-child td { border-bottom: 0; }
        td.num { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .result { font-size: 12px; padding: 2px 7px; border: 1px solid; white-space: nowrap; }
        .pass { color: var(--ok); background: var(--ok-bg); }
        .fail { color: var(--warning); background: var(--warning-bg); }
        .none { color: var(--muted); }
        .method p, .method li { color: var(--ink-2); max-width: 68ch; }
        .method ul { margin: 10px 0 0 18px; }
        .method li + li { margin-top: 6px; }
        .method code { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
        #status { margin-top: 16px; color: var(--muted); }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        footer { margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--rule-dark); font-size: 12.5px; color: var(--muted); }
    </style>
</head>
<body>
<div class="page">
    <header class="doc-header">
        <a class="wordmark" href="/"><img src="/assets/favicon-512.png" alt="SecOpsAI mark" width="26" height="26">SecOpsAI</a>
        <nav class="doc-nav" aria-label="Site">
            <a href="/">Home</a>
            <a href="https://docs.secopsai.dev">Docs</a>
            <a href="https://github.com/Techris93/secopsai">GitHub</a>
        </nav>
    </header>

    <h1>Frontier scorecard</h1>
    <div class="meta" id="meta" aria-live="polite">
        <div><span class="key">Targets met</span><strong id="met">—</strong></div>
        <div><span class="key">Measured</span><span id="generated">—</span></div>
        <div><span class="key">Held-out cutoff</span><span id="cutoff">—</span></div>
        <div><span class="key">Code</span><span id="commit">—</span></div>
    </div>
    <p id="status">Loading…</p>

    <div id="phases"></div>

    <section class="method">
        <h2>Method</h2>
        <p id="rule"></p>
        <ul>
            <li>Targets file: <a id="targets-link" href="https://github.com/Techris93/secopsai/blob/main/eval/frontier/targets.json">eval/frontier/targets.json</a>, SHA-256 <code id="targets-hash">—</code></li>
            <li>Benchmark run: <a id="benchmark-link" href="#">—</a></li>
            <li>Corpora: <span id="corpora">—</span></li>
            <li>Scorecard run: <a id="scorecard-link" href="#">—</a></li>
            <li>Raw data: <a href="https://ledger.secopsai.dev/public/frontier-scorecard">frontier-scorecard.json</a></li>
        </ul>
    </section>

    <footer>SecOpsAI · <a href="mailto:research@secopsai.dev">research@secopsai.dev</a></footer>
</div>
</body>
</html>
