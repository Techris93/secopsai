name: Test & Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SECOPSAI_BASE_IMAGE: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 mypy jsonschema

      - name: Prepare test data directories
        run: |
          mkdir -p data/openclaw/raw
          mkdir -p data/openclaw/replay/labeled
          # Materialize the benchmark corpus expected by regression tests.
          if [ -f "data/fixtures/events.json" ]; then
            cp data/fixtures/events.json data/events.json
          fi
          if [ -f "data/fixtures/events_unlabeled.json" ]; then
            cp data/fixtures/events_unlabeled.json data/events_unlabeled.json
          fi
          # Copy fixture data
          if [ -f "data/fixtures/openclaw/sample_audit.jsonl" ]; then
            cp data/fixtures/openclaw/sample_audit.jsonl data/openclaw/raw/audit.jsonl
          fi
          if [ -f "data/fixtures/openclaw/attack_mix.json" ]; then
            cp data/fixtures/openclaw/attack_mix.json data/openclaw/replay/labeled/attack_mix.json
          fi
          if [ -f "data/fixtures/openclaw/current_replay.json" ]; then
            cp data/fixtures/openclaw/current_replay.json data/openclaw/replay/labeled/current.json
          fi
          # Create mock schema file for tests (at parent directory level)
          mkdir -p ../secopsai-dashboard/supabase_migrations
          cat > ../secopsai-dashboard/supabase_migrations/2026-03-28_findings.sql <<'SCHEMA_EOF'
            create table if not exists public.findings (
              id uuid primary key default gen_random_uuid(),
              external_finding_id text not null,
              title text not null,
              summary text,
              severity text,
              severity_score int,
              status text,
              disposition text,
              confidence text,
              source text,
              source_platform text,
              correlation_type text,
              detection_layer text,
              detected_at timestamptz,
              first_seen_at timestamptz,
              last_seen_at timestamptz,
              rule_id text,
              rule_name text,
              mitre text,
              mitre_ids text[],
              event_count int,
              event_ids jsonb,
              risk_tags text[],
              recommended_actions jsonb,
              raw_payload jsonb,
              metadata jsonb
            );
          SCHEMA_EOF

      - name: Verify docs examples
        run: |
          python scripts/verify_docs_examples.py

      - name: Verify installers and website parity
        run: |
          bash -n setup.sh
          sh -n docs/install.sh
          sh -n docs/install-hermes.sh
          cmp website/index.html www/index.html
          cmp docs/install.sh website/install.sh
          cmp docs/install.sh www/install.sh
          cmp docs/install-hermes.sh website/install-hermes.sh
          cmp docs/install-hermes.sh www/install-hermes.sh
          grep -F 'data-tab="hermes"' website/index.html
          grep -F 'https://secopsai.dev/install-hermes.sh' website/index.html

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude .git,.venv,__pycache__,data

          # Exit-zero treats all errors as warnings. Check complexity
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
            --exclude .git,.venv,__pycache__,data

      - name: Type check with mypy
        run: |
          mypy detect.py evaluate.py prepare.py swarm.py --ignore-missing-imports

      - name: Test detection rules
        run: |
          python -m pytest tests/ -v --cov=detect --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  chatgpt-app:
    name: ChatGPT app MCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/secopsai-chatgpt/package-lock.json

      - name: Install locked dependencies
        working-directory: apps/secopsai-chatgpt
        run: npm ci --ignore-scripts

      - name: Check and test MCP server
        working-directory: apps/secopsai-chatgpt
        run: |
          npm run check
          npm test

      - name: Audit MCP dependencies
        working-directory: apps/secopsai-chatgpt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm audit --audit-level=moderate; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm audit remained unsuccessful after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

  build-container:
    needs: [test, chatgpt-app]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image for security scan
        id: container-build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          load: true
          push: false
          tags: secopsai-ci-scan:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

      - name: Smoke-test container startup and health command
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p container-security
          container_id="$(docker run -d "secopsai-ci-scan:${GITHUB_SHA}")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 10); do
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" = "true" ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Running}}' "$container_id")" = "true"
          docker exec "$container_id" \
            python -c "from detect import run_detection; print('health-ok')"
          docker stop --timeout 10 "$container_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = "0"
          python - <<'PY'
          import json
          from pathlib import Path

          Path("container-security/container-smoke.json").write_text(
              json.dumps(
                  {
                      "schema_version": "secopsai.container-smoke.v1",
                      "startup": "passed",
                      "health_command": "passed",
                      "graceful_shutdown": "passed",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Record exact image identities and package provenance
        id: image-identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p container-security
          docker pull "$SECOPSAI_BASE_IMAGE"
          final_digest="$(docker image inspect --format '{{.Id}}' "secopsai-ci-scan:${GITHUB_SHA}")"
          base_digest="$(docker image inspect --format '{{.Id}}' "$SECOPSAI_BASE_IMAGE")"
          base_repo_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$SECOPSAI_BASE_IMAGE")"
          printf 'final_digest=%s\n' "$final_digest" >> "$GITHUB_OUTPUT"
          printf 'base_digest=%s\n' "$base_digest" >> "$GITHUB_OUTPUT"
          printf 'base_repo_digest=%s\n' "$base_repo_digest" >> "$GITHUB_OUTPUT"
          export FINAL_DIGEST="$final_digest"
          export BASE_DIGEST="$base_digest"
          export BASE_REPO_DIGEST="$base_repo_digest"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("container-security/image-identities.json").write_text(
              json.dumps(
                  {
                      "schema_version": "secopsai.container-image-identities.v1",
                      "commit": os.environ["GITHUB_SHA"],
                      "final_image": os.environ["FINAL_DIGEST"],
                      "base_image": os.environ["BASE_DIGEST"],
                      "base_repo_digest": os.environ["BASE_REPO_DIGEST"],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          docker history --no-trunc --format '{{json .}}' "$final_digest" > container-security/final-image-history.jsonl
          docker run --rm "$final_digest" \
            python scripts/container_package_provenance.py \
            > container-security/container-package-provenance.json
          container_id="$(docker create "$final_digest")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker export "$container_id" > container-security/rootfs.tar
          tar -tf container-security/rootfs.tar | grep -Ei \
            '(^|/)(ensurepip|[^/]*(msgpack|setuptools)[^/]*|[^/]+\.(whl|egg|zip))(/|$)' \
            > container-security/rootfs-package-paths.txt || true
          rm -f container-security/rootfs.tar
      - name: Generate Trivy base-image JSON
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ steps.image-identity.outputs.base_digest }}
          scanners: "vuln"
          exit-code: "0"
          format: "json"
          output: "container-security/trivy-base.json"

      - name: Generate Trivy final-image JSON
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ steps.image-identity.outputs.final_digest }}
          scanners: "vuln"
          exit-code: "0"
          format: "json"
          output: "container-security/trivy-final.json"

      - name: Generate Trivy image SARIF
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ steps.image-identity.outputs.final_digest }}
          scanners: "vuln"
          exit-code: "0"
          format: "sarif"
          output: "container-security/trivy-results.sarif"

      - name: Record Trivy version, database, and normalized provenance
        shell: bash
        run: |
          set -euo pipefail
          trivy version --format json > container-security/trivy-version.json
          python scripts/summarize_container_security.py \
            --input container-security/trivy-base.json \
            --output container-security/trivy-base-evidence.json \
            --image-digest '${{ steps.image-identity.outputs.base_digest }}' \
            --trivy-version "$(trivy --version | head -1)" \
            --db-metadata container-security/trivy-version.json
          python scripts/summarize_container_security.py \
            --input container-security/trivy-final.json \
            --output container-security/trivy-final-evidence.json \
            --image-digest '${{ steps.image-identity.outputs.final_digest }}' \
            --trivy-version "$(trivy --version | head -1)" \
            --db-metadata container-security/trivy-version.json

      - name: Generate independent CycloneDX SBOM with Syft
        uses: anchore/sbom-action@d7200a720eed41adabe049cd48f7e13cd52bf858
        with:
          image: ${{ steps.image-identity.outputs.final_digest }}
          format: cyclonedx-json
          output-file: container-security/secopsai.cdx.json
          artifact-name: secopsai-container-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan exact image with Grype
        uses: anchore/scan-action@ac02c2cca96bd43004ad85e5fc951721f0a623ea
        with:
          image: ${{ steps.image-identity.outputs.final_digest }}
          fail-build: false
          severity-cutoff: high
          grype-version: v0.114.0
          cache-db: true
          output-format: json
          output-file: container-security/grype-results.json
          vex: .github/vex/python-3.13.14-backports.openvex.json

      - name: Validate evidence-backed container VEX
        run: |
          python scripts/validate_container_vex.py \
            --output container-security/vex-validation.json

      - name: Upload container security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-security-${{ github.sha }}
          path: container-security/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@a60c4df7a135c7317c1e9ddf9b5a9b07a910dda9
        if: always() && hashFiles('container-security/trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: "container-security/trivy-results.sarif"
          category: "trivy-image"

      - name: Enforce SBOM package-version assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          sbom = json.loads(Path("container-security/secopsai.cdx.json").read_text(encoding="utf-8"))
          forbidden = {("msgpack", "1.1.2"), ("setuptools", "70.3.0")}
          present = {
              (str(component.get("name", "")).lower(), str(component.get("version", "")))
              for component in sbom.get("components", [])
          }
          vulnerable = sorted(forbidden & present)
          if vulnerable:
              raise SystemExit(f"Forbidden vulnerable versions remain in CycloneDX SBOM: {vulnerable}")
          PY

      - name: Enforce Grype HIGH/CRITICAL image gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/enforce_grype_image_gate.py --input container-security/grype-results.json

      - name: Enforce Trivy HIGH/CRITICAL image gate
        run: |
          python scripts/summarize_container_security.py \
            --input container-security/trivy-final.json \
            --output container-security/trivy-final-evidence.json \
            --image-digest '${{ steps.image-identity.outputs.final_digest }}' \
            --trivy-version "$(trivy --version | head -1)" \
            --db-metadata container-security/trivy-version.json \
            --gate

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the already-scanned image
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag '${{ steps.image-identity.outputs.final_digest }}' "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  release:
    needs: [test, chatgpt-app, build-container]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Create Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            See CHANGELOG.md for details.

            ## Container Images
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
          draft: false
          prerelease: false
