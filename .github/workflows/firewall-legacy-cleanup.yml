name: Firewall Legacy Cleanup

# One-off: delete the 512 two-digit blocklist shards (firewall/npm/00.json ..
# firewall/pypi/ff.json) left in R2 after the move to three-digit shards
# (PR 284). Current shards have three hex digits and cannot match. Also checks
# that the firewall accepts its current token and refuses any other.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to remove the 512 legacy shards"
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREWALL_TOKEN: ${{ secrets.FIREWALL_TOKEN }}
      FIREWALL_URL: https://secopsai-registry-firewall.onyedikachristopher-agada.workers.dev
      BUCKET: secopsai-research-ledger
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: '[ "$CONFIRM" = "DELETE" ] || { echo "::error::confirm must be DELETE"; exit 1; }'
      - name: Firewall token check
        run: |
          good=$(curl -s -o /dev/null -w "%{http_code}" --oauth2-bearer "$FIREWALL_TOKEN" "$FIREWALL_URL/npm/left-pad")
          bad=$(curl -s -o /dev/null -w "%{http_code}" --oauth2-bearer "not-the-firewall-token" "$FIREWALL_URL/npm/left-pad")
          echo "current token: $good, wrong token: $bad"
          [ "$good" = 200 ] && [ "$bad" = 401 ]
      - name: Delete the legacy shards
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects"
          # The URL form must find a legacy object first, or every delete would look like "already gone".
          probe=$(curl -s -o /dev/null -w "%{http_code}" --oauth2-bearer "$CLOUDFLARE_API_TOKEN" "$api/firewall%2Fnpm%2F00.json")
          echo "probe firewall/npm/00.json: $probe"
          [ "$probe" = 200 ] || { echo "::error::legacy object not found at the expected URL ($probe); nothing deleted"; exit 1; }
          deleted=0; missing=0; failed=0
          for eco in npm pypi; do
            for i in $(seq 0 255); do
              key=$(printf 'firewall/%s/%02x.json' "$eco" "$i")
              case "$key" in firewall/npm/[0-9a-f][0-9a-f].json|firewall/pypi/[0-9a-f][0-9a-f].json) ;; *) echo "refusing $key"; exit 1;; esac
              code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                --oauth2-bearer "$CLOUDFLARE_API_TOKEN" "$api/${key//\//%2F}")
              case "$code" in 200|204) deleted=$((deleted+1));; 404) missing=$((missing+1));; *) failed=$((failed+1)); echo "$key -> $code";; esac
            done
          done
          echo "deleted $deleted, already gone $missing, failed $failed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" = 0 ]
      - name: Current shards still readable
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --oauth2-bearer "$FIREWALL_TOKEN" -X POST "$FIREWALL_URL/check" \
            -d '{"packages":[{"ecosystem":"pypi","name":"carcent","version":"2.1.0"}]}')
          body=$(curl -s --oauth2-bearer "$FIREWALL_TOKEN" -X POST "$FIREWALL_URL/check" -d '{"packages":[{"ecosystem":"pypi","name":"carcent","version":"2.1.0"}]}')
          echo "$code $body"
          echo "$body" | grep -q MAL-2026-808
