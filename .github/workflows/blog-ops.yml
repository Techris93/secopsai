name: Blog Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Blog action to run"
        required: true
        type: choice
        options:
          - news-run
          - news-fetch
          - news-draft
          - approve
          - reject
          - needs-review
          - save-draft
          - publish-approved
          - rebuild-feeds
          - deploy
      draft:
        description: "Draft slug, path, or unique fragment"
        required: false
        type: string
      note:
        description: "Reviewer note"
        required: false
        type: string
      limit:
        description: "Fetch/draft limit"
        required: false
        default: "5"
        type: string
      title:
        description: "Edited draft title"
        required: false
        type: string
      summary:
        description: "Edited draft summary"
        required: false
        type: string
      severity:
        description: "Edited draft severity"
        required: false
        type: string
      categories:
        description: "Comma- or newline-separated categories"
        required: false
        type: string
      references:
        description: "Comma- or newline-separated references"
        required: false
        type: string
      body_markdown:
        description: "Edited body markdown"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: blog-ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blog-ops:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACTION: ${{ inputs.action }}
      DRAFT: ${{ inputs.draft }}
      NOTE: ${{ inputs.note }}
      LIMIT: ${{ inputs.limit || '5' }}
      TITLE: ${{ inputs.title }}
      SUMMARY: ${{ inputs.summary }}
      SEVERITY: ${{ inputs.severity }}
      CATEGORIES: ${{ inputs.categories }}
      REFERENCES: ${{ inputs.references }}
      BODY_MARKDOWN: ${{ inputs.body_markdown }}

    steps:
      - name: Checkout SecOpsAI
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Move to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node for Wrangler
        if: ${{ inputs.action == 'deploy' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run requested Blog Ops command
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN=python3
          else
            PYTHON_BIN=python
          fi
          limit="${LIMIT:-5}"
          raw_action="${ACTION:-}"
          normalized_action="$raw_action"
          case "$raw_action" in
            "fetch-news"|"Fetch news"|"fetch news")
              normalized_action="news-fetch"
              ;;
            "create-drafts"|"Create drafts"|"create drafts")
              normalized_action="news-draft"
              ;;
            "run-fetch-draft"|"fetch-draft"|"Run fetch + draft"|"run fetch + draft"|"news_run")
              normalized_action="news-run"
              ;;
            "publish"|"publish_approved"|"Publish approved"|"publish approved")
              normalized_action="publish-approved"
              ;;
            "rebuild"|"rebuild_feeds"|"Rebuild feeds"|"rebuild feeds")
              normalized_action="rebuild-feeds"
              ;;
            "deploy-blog"|"Deploy blog"|"deploy blog")
              normalized_action="deploy"
              ;;
          esac
          echo "Blog Ops action: raw='${raw_action}' normalized='${normalized_action}' limit='${limit}'"
          case "$normalized_action" in
            news-fetch)
              "$PYTHON_BIN" -m secopsai.cli blog news-fetch --limit "$limit"
              ;;
            news-draft)
              "$PYTHON_BIN" -m secopsai.cli blog news-fetch --limit "$limit"
              "$PYTHON_BIN" -m secopsai.cli blog news-draft --limit "$limit"
              ;;
            news-run)
              "$PYTHON_BIN" -m secopsai.cli blog news-run --limit "$limit"
              ;;
            approve)
              test -n "$DRAFT"
              "$PYTHON_BIN" -m secopsai.cli blog news-review approve "$DRAFT" --note "${NOTE:-Approved from Blog Ops dashboard}"
              ;;
            reject)
              test -n "$DRAFT"
              "$PYTHON_BIN" -m secopsai.cli blog news-review reject "$DRAFT" --note "${NOTE:-Rejected from Blog Ops dashboard}"
              ;;
            needs-review)
              test -n "$DRAFT"
              "$PYTHON_BIN" -m secopsai.cli blog news-review needs-review "$DRAFT" --note "${NOTE:-Returned to review from Blog Ops dashboard}"
              ;;
            save-draft)
              test -n "$DRAFT"
              body_file="$RUNNER_TEMP/secopsai-blog-draft.md"
              BODY_FILE="$body_file" "$PYTHON_BIN" -c 'import os; from pathlib import Path; Path(os.environ["BODY_FILE"]).write_text(os.environ.get("BODY_MARKDOWN", ""), encoding="utf-8")'
              cmd=("$PYTHON_BIN" -m secopsai.cli blog news-review edit "$DRAFT")
              [ -n "${TITLE:-}" ] && cmd+=(--title "$TITLE")
              [ -n "${SUMMARY:-}" ] && cmd+=(--summary "$SUMMARY")
              [ -n "${SEVERITY:-}" ] && cmd+=(--severity "$SEVERITY")
              [ -n "${CATEGORIES:-}" ] && cmd+=(--categories "$CATEGORIES")
              [ -n "${REFERENCES:-}" ] && cmd+=(--references "$REFERENCES")
              [ -s "$body_file" ] && cmd+=(--body-file "$body_file")
              [ -n "${NOTE:-}" ] && cmd+=(--note "$NOTE")
              "${cmd[@]}"
              ;;
            publish-approved)
              "$PYTHON_BIN" -m secopsai.cli blog news-publish-approved --rebuild
              ;;
            rebuild-feeds)
              "$PYTHON_BIN" -m secopsai.cli blog rebuild-feeds
              ;;
            deploy)
              echo "Deploy action selected; no local content mutation."
              ;;
            *)
              echo "Unsupported Blog Ops action: '${raw_action}' (normalized: '${normalized_action}')" >&2
              echo "Supported actions: news-run, news-fetch, news-draft, approve, reject, needs-review, save-draft, publish-approved, rebuild-feeds, deploy" >&2
              exit 2
              ;;
          esac

      - name: Verify blog outputs
        if: ${{ inputs.action != 'deploy' }}
        run: |
          python scripts/verify_blog.py
          node --check blog/_worker.js
          node --check blog/functions/api/comments.js
          node --check blog/assets/blog.js
          node --check blog/assets/comments.js
          python -m pytest tests/test_blog.py -q

      - name: Commit intentional Blog Ops changes
        if: ${{ inputs.action != 'deploy' }}
        run: |
          set -euo pipefail
          git config user.name "secopsai-blog-ops[bot]"
          git config user.email "115749095+Techris93@users.noreply.github.com"

          git add blog/posts blog/assets/social blog/index.html blog/json-feed.html blog/feed.json blog/feed.xml
          git add blog/data/published-posts.json 2>/dev/null || true
          if [ -d blog/assets/posts ]; then
            git add blog/assets/posts
          fi
          if [ -d blog/drafts ]; then
            # Stage draft edits, new forced draft files, and deletions caused by publishing.
            git add -A blog/drafts
            git add -f blog/drafts/*.json 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            echo "No Blog Ops changes to commit."
            exit 0
          fi

          git commit -m "Run Blog Ops ${ACTION}"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done

          echo "Unable to push Blog Ops changes after rebasing onto origin/main." >&2
          exit 1

      - name: Deploy blog to Cloudflare Pages
        if: ${{ inputs.action == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare deploy secrets are not configured; cannot deploy blog." >&2
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this repository's Actions secrets." >&2
            exit 1
          fi
          python -m secopsai.cli blog rebuild-feeds
          python scripts/verify_blog.py
          npx --yes wrangler@latest pages deploy blog --project-name secopsai-blog --branch main

      - name: Mark deployed drafts after successful deploy
        if: ${{ inputs.action == 'deploy' }}
        run: |
          python -m secopsai.cli blog news-mark-deployed --json

      - name: Commit deployed draft state
        if: ${{ inputs.action == 'deploy' }}
        run: |
          set -euo pipefail
          git config user.name "secopsai-blog-ops[bot]"
          git config user.email "115749095+Techris93@users.noreply.github.com"

          if [ -d blog/drafts ]; then
            git add -A blog/drafts
            git add -f blog/drafts/*.json 2>/dev/null || true
          fi
          git add blog/posts blog/assets/social blog/index.html blog/json-feed.html blog/feed.json blog/feed.xml
          if [ -d blog/assets/posts ]; then
            git add blog/assets/posts
          fi
          git add blog/data/published-posts.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No deployed draft state changes to commit."
            exit 0
          fi

          git commit -m "Mark Blog Ops drafts deployed"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done

          echo "Unable to push deployed Blog Ops state after rebasing onto origin/main." >&2
          exit 1
