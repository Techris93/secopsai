name: Deploy Installer Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-installers.yml"
      - "docs/install.sh"
      - "docs/install-hermes.sh"
      - "scripts/cloudflare-installer-worker.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secopsai-installer-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Resolve existing installer Worker
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_response=$(curl -fsSL \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=secopsai.dev&status=active")
          zone_id=$(printf '%s' "$zone_response" | jq -er '.result[0].id')
          routes_response=$(curl -fsSL \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes")
          worker_name=$(printf '%s' "$routes_response" | jq -r \
            '.result[] | select(.pattern == "secopsai.dev/install.sh*" or .pattern == "secopsai.dev/install.sh") | .script' \
            | head -n 1)
          if [ -z "$worker_name" ] || [ "$worker_name" = "null" ]; then
            worker_name="secopsai-installer-router"
          fi
          echo "name=$worker_name" >> "$GITHUB_OUTPUT"

      - name: Deploy installer Worker and routes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.114.0 deploy scripts/cloudflare-installer-worker.js \
            --name "${{ steps.worker.outputs.name }}" \
            --compatibility-date 2026-07-25 \
            --route "secopsai.dev/install.sh*" \
            --route "secopsai.dev/install-hermes.sh*"

      - name: Verify public installers
        run: |
          set -euo pipefail
          for installer in install.sh install-hermes.sh; do
            first_line=$(curl -fsSL --retry 5 --retry-delay 5 \
              "https://secopsai.dev/${installer}" | sed -n '1p')
            if [ "$first_line" != "#!/bin/sh" ]; then
              echo "${installer} did not return a POSIX shell installer" >&2
              exit 1
            fi
          done
