name: Research Worker

# Free replacement for the Render background worker.  Each run restores the
# research ledger from R2 (via ledger.secopsai.dev), runs a bounded number of
# worker cycles, checkpoints the ledger back, and exits.  The concurrency
# group guarantees a single ledger writer.
#
# Runs are started by the ledger-store Worker's Cron Trigger, which checks every
# five minutes and dispatches only after the previous run has finished and at
# least 30 minutes after it started, so runs never queue behind each other
# (GitHub's own schedule trigger proved unreliable for this cadence).  Those
# dispatches pass trigger=cloudflare-cron and run only while the repository
# variable RESEARCH_WORKER_ENABLED is "true", which is the kill switch.
on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Worker cycles to run"
        required: false
        default: "6"
      delivery_only:
        description: "Verify restored delivery without repeating collection, analysis or model jobs"
        type: boolean
        default: false
      delivery_seconds:
        description: "Maximum seconds for a delivery-only outbox drain (1–2700)"
        type: number
        default: 840
      retry_sources:
        description: "Optional comma-separated names of failed primary sources to retry once during delivery verification"
        required: false
        default: ""
      retry_collectors:
        description: "Optional comma-separated names of up to ten enabled registry collectors to retry once during delivery verification"
        required: false
        default: ""
      allow_empty_ledger:
        description: "Start a new empty ledger if none exists in R2 (first run only)"
        type: boolean
        default: false
      trigger:
        description: "Who started the run (cloudflare-cron or manual)"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: secopsai-research-ledger
  cancel-in-progress: false

jobs:
  run:
    if: inputs.trigger != 'cloudflare-cron' || vars.RESEARCH_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.delivery_only && 75 || 60 }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SECOPS_FINDINGS_DIR: /home/runner/research
      SECOPSAI_LEDGER_ALLOW_EMPTY: ${{ inputs.allow_empty_ledger && 'true' || 'false' }}
      LEDGER_STORE_URL: https://ledger.secopsai.dev
      LEDGER_STORE_TOKEN: ${{ secrets.LEDGER_STORE_TOKEN }}
      SECOPSAI_CORE_ENVIRONMENT: production
      SECOPSAI_CORE_COORDINATOR_URL: https://core.secopsai.dev
      SECOPSAI_CORE_WORKER_ID: github-actions-research-worker
      SECOPSAI_CORE_BRIDGE_TOKEN: ${{ secrets.SECOPSAI_CORE_BRIDGE_TOKEN }}
      # Read-only public API calls for the GitHub Actions tag watch.
      SECOPSAI_GITHUB_TOKEN: ${{ github.token }}
      # Collectors that ship paused; enabled by the operator on 2026-10-11.
      SECOPSAI_ENABLE_COLLECTORS: vscode-marketplace
      # Hits created before this time that ended inconclusive are rescanned
      # with the current rules once; scores of 80+ go back to model triage.
      # Move it forward after a significant rule change.
      SECOPSAI_RETRIAGE_BEFORE: "2026-10-11T17:10:00Z"
      SECOPSAI_RETRIAGE_MIN_SCORE: "80"
      # Clef remains paused; closure also needs independently reviewed calibration.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
      SECOPSAI_CLEF_PRESCREEN: "0"  # paused to save cost; set to "1" to resume
      SECOPSAI_DECISION_MODE: "observe"  # closure requires reviewed decision-v2 calibration
      SECOPSAI_INCREMENTAL_CHECKPOINTS: ${{ vars.RESEARCH_INCREMENTAL_CHECKPOINTS == 'true' && '1' || '0' }}
      SECOPSAI_PAGE_DELTA_CHECKPOINTS: ${{ vars.RESEARCH_PAGE_DELTA_CHECKPOINTS == 'true' && '1' || '0' }}
      SECOPSAI_VERIFY_RETRY_SOURCES: ${{ inputs.retry_sources }}
      SECOPSAI_VERIFY_RETRY_COLLECTORS: ${{ inputs.retry_collectors }}
      SECOPSAI_VERIFY_DELIVERY_ONLY: ${{ inputs.delivery_only && '1' || '0' }}
      SECOPSAI_VERIFY_DELIVERY_SECONDS: ${{ inputs.delivery_seconds || 840 }}
      SECOPSAI_WORKER_STAGE_LOGS: '1'
      SECOPSAI_LEDGER_CHECKPOINT_SECONDS: ${{ vars.RESEARCH_INCREMENTAL_CHECKPOINTS == 'true' && '60' || '3600' }}
      SECOPSAI_PRIMARY_INTEL: "1"  # source intake and draft assembly; never automatic publication
      SECOPSAI_RESEARCH_ASSISTANT_AUTOSTART: "1"  # one evidence-ready case team per day; read-only proposals only
      SECOPSAI_PUBLIC_ARTIFACT_RECOVERY: "1"  # exact public bytes only; hash mismatch cannot recover
      SECOPSAI_ARTIFACT_VAULT: "1"  # private, immutable backups of public registry artifacts only
      SECOPSAI_RESEARCH_ALERT_WEBHOOK_URL: https://core.secopsai.dev/api/v1/research/alerts/webhook
      SECOPSAI_RESEARCH_ALERT_WEBHOOK_SECRET: ${{ secrets.SECOPSAI_RESEARCH_ALERT_WEBHOOK_SECRET }}
      SECOPSAI_RESEARCH_ALERT_EMAIL: research@secopsai.dev
      SECOPSAI_RESEARCH_FROM_EMAIL: research@secopsai.dev
      SECOPSAI_EMAIL_LOGO_URL: https://secopsai.dev/assets/favicon-512.png
      SECOPSAI_EMAIL_PRODUCT_URL: https://secopsai.dev/
      SECOPSAI_RESEARCH_ALERT_MAX_ATTEMPTS: "5"
      SECOPSAI_SMTP_HOST: smtp.resend.com
      SECOPSAI_SMTP_PORT: "465"
      SECOPSAI_SMTP_USERNAME: resend
      SECOPSAI_SMTP_PASSWORD: ${{ secrets.SECOPSAI_SMTP_PASSWORD }}
      # Email alerts need the Resend SMTP password; without it, alerts still
      # reach Core and Mission Control through the signed webhook.
      SECOPSAI_RESEARCH_AUTO_ALERT_CHANNELS: ${{ secrets.SECOPSAI_SMTP_PASSWORD != '' && 'email,webhook' || 'webhook' }}
      SECOPSAI_RESEARCH_EXTERNAL_ALERT_CHANNELS: webhook
      SECOPSAI_NPM_ENRICHMENT_EVENT_LIMIT: "100"
      # Rules-first funnel: YARA-scan this many new releases per cycle.
      SECOPSAI_NPM_PRESCAN_LIMIT: "150"
      SECOPSAI_NPM_STATIC_ANALYSIS_LIMIT: "10"
      SECOPSAI_SENTRY_TRACES_SAMPLE_RATE: "0"
      SECOPSAI_STORAGE_WARNING_USED_PERCENT: "70"
      SECOPSAI_STORAGE_MAX_USED_PERCENT: "85"
      SECOPSAI_RESEARCH_EVENT_RETENTION_HOURS: "24"
      SECOPSAI_RESEARCH_CANDIDATE_EVENT_RETENTION_DAYS: "90"
      SECOPSAI_RESEARCH_RUN_RETENTION_DAYS: "30"
      SECOPSAI_RESEARCH_NPM_ANALYSIS_RETENTION_DAYS: "30"
      SECOPSAI_RESEARCH_GAP_RETENTION_DAYS: "180"
      SECOPSAI_RESEARCH_DELIVERY_RETENTION_DAYS: "90"
      SECOPSAI_RESEARCH_SNAPSHOTS_PER_COLLECTOR: "2"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require the ledger token
        run: test -n "$LEDGER_STORE_TOKEN" || { echo "LEDGER_STORE_TOKEN secret is required" >&2; exit 1; }

      - name: Fetch pinned YARA rule packs
        run: echo "SECOPSAI_YARA_RULE_DIRS=$(bash scripts/fetch_rule_packs.sh)" >> "$GITHUB_ENV"

      - name: Restore ledger, run worker cycles, checkpoint
        # Routine bounded runs include an additional 14-minute durable delivery
        # drain; the job timeout reserves time for restore and checkpoints.
        # Exhausted retries still fail the run so an unsaved checkpoint is visible.
        run: |
          delivery_args=()
          max_seconds=900
          if [ -n "$SECOPSAI_VERIFY_RETRY_COLLECTORS" ] && [ "$SECOPSAI_VERIFY_DELIVERY_ONLY" != "1" ]; then
            echo "retry_collectors requires delivery_only=true" >&2
            exit 2
          fi
          if [ "$SECOPSAI_VERIFY_DELIVERY_ONLY" = "1" ]; then
            if ! [[ "$SECOPSAI_VERIFY_DELIVERY_SECONDS" =~ ^[0-9]+$ ]]; then
              echo "delivery_seconds must be between 1 and 2700" >&2
              exit 2
            fi
            delivery_seconds=$((10#$SECOPSAI_VERIFY_DELIVERY_SECONDS))
            if (( delivery_seconds < 1 || delivery_seconds > 2700 )); then
              echo "delivery_seconds must be between 1 and 2700" >&2
              exit 2
            fi
            delivery_args+=(--delivery-only)
            max_seconds=$((delivery_seconds + 60))
          else
            delivery_args+=(--drain-after-cycles)
          fi
          python -u cloudflare/secopsai-research-runner/container/supervisor.py --cycles "${{ inputs.cycles || '6' }}" --max-seconds "$max_seconds" "${delivery_args[@]}"

      - name: Verify final checkpoint and hosted delivery health
        if: always()
        # This runs after the supervisor's final checkpoint and routine drain.
        # Any durable chunk still pending keeps the delivery gate red.
        run: python scripts/research_operation_watchdog.py --scope delivery --output reports/research/delivery-health.json

      - name: Preserve delivery verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-delivery-verification
          path: reports/research/delivery-health.json
