name: Stream Scan

# Frontier phase 1: prescan every new npm and PyPI release (secopsai/stream_scan.py).
# Started every five minutes by the ledger-store Worker's cron, only when the
# previous run has finished; the schedule below is a fallback if the cron stops.
# Static analysis only: packages are downloaded to memory and scanned, never
# installed or executed.

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "Who started the run"
        required: false
        default: "manual"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: stream-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LEDGER_STORE_URL: https://ledger.secopsai.dev
      LEDGER_STORE_TOKEN: ${{ secrets.LEDGER_STORE_TOKEN }}
      SECOPSAI_CORE_COORDINATOR_URL: https://core.secopsai.dev
      SECOPSAI_CORE_WORKER_ID: github-actions-stream-scan
      SECOPSAI_CORE_BRIDGE_TOKEN: ${{ secrets.SECOPSAI_CORE_BRIDGE_TOKEN }}
      SECOPSAI_RESEARCH_ALERT_WEBHOOK_URL: https://core.secopsai.dev/api/v1/research/alerts/webhook
      SECOPSAI_RESEARCH_ALERT_WEBHOOK_SECRET: ${{ secrets.SECOPSAI_RESEARCH_ALERT_WEBHOOK_SECRET }}
      SECOPSAI_RESEARCH_ALERT_EMAIL: research@secopsai.dev
      SECOPSAI_SMTP_HOST: smtp.resend.com
      SECOPSAI_SMTP_PORT: "465"
      SECOPSAI_SMTP_USERNAME: resend
      SECOPSAI_SMTP_PASSWORD: ${{ secrets.SECOPSAI_SMTP_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch pinned YARA rule packs
        run: echo "SECOPSAI_YARA_RULE_DIRS=$(bash scripts/fetch_rule_packs.sh)" >> "$GITHUB_ENV"

      - name: Prescan every new release
        run: python -u scripts/stream_scan.py --budget-seconds 900 --workers 12

      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stream-scan
          path: reports/stream-scan.json
          if-no-files-found: ignore
          retention-days: 7
