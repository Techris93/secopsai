name: Research Recovery Drill
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-recovery-drill
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      LEDGER_STORE_URL: https://ledger.secopsai.dev
      LEDGER_STORE_TOKEN: ${{ secrets.LEDGER_STORE_TOKEN }}
      SECOPSAI_PAGE_DELTA_CHECKPOINTS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore production bytes and measure ledger size in disposable storage
        run: python scripts/research_ledger_size_report.py --output reports/research/ledger-size.json
      - name: Preserve bounded recovery measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-ledger-size
          path: reports/research/ledger-size.json
