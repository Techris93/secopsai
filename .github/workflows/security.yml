name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan weekly
    - cron: "0 0 * * 0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"

      - name: Run Trivy file/config scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "sarif"
          limit-severities-for-sarif: true
          output: "trivy-fs-results.sarif"

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "secret"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "sarif"
          limit-severities-for-sarif: true
          output: "trivy-secret-results.sarif"

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "sarif"
          limit-severities-for-sarif: true
          output: "trivy-config-results.sarif"

      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@a60c4df7a135c7317c1e9ddf9b5a9b07a910dda9
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-fs"

      - name: Upload Trivy secret SARIF
        uses: github/codeql-action/upload-sarif@a60c4df7a135c7317c1e9ddf9b5a9b07a910dda9
        if: always() && hashFiles('trivy-secret-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: "trivy-secret-results.sarif"
          category: "trivy-secret"

      - name: Upload Trivy config SARIF
        uses: github/codeql-action/upload-sarif@a60c4df7a135c7317c1e9ddf9b5a9b07a910dda9
        if: always() && hashFiles('trivy-config-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: "trivy-config-results.sarif"
          category: "trivy-config"

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: "secopsai"
          path: "."
          format: "SARIF"
          args: >
            --failOnCVSS 7.0
            --disableNodeAudit
            --suppression .github/dependency-check-suppressions.xml

      - name: Upload OWASP Dependency-Check results
        uses: github/codeql-action/upload-sarif@a60c4df7a135c7317c1e9ddf9b5a9b07a910dda9
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: "reports/dependency-check-report.sarif"
          category: "dependency-check"

      - name: Create security badge
        run: |
          # This creates a simple status file that can be displayed in README
          # Badge format: "Security: ✓ Scanned on [date]"
          echo "Last security scan: $(date)" > SECURITY_BADGE.txt

  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"

      - name: Check for vulnerable dependencies
        run: |
          pip install bandit

          # Static security analysis. High-severity findings block the workflow;
          # lower-severity findings remain visible in the SARIF/security reports.
          bandit -r . -x ./.git,./.venv,./__pycache__,./data,./tests --severity-level high -f json -o bandit-report.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

  license-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"

      - name: Check licenses with REUSE
        uses: fsfe/reuse-action@4d31d76f16747cf196a58f1ae62f215e7cc739a9
        continue-on-error: true

      - name: License compliance report
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          pip-licenses --format=csv --output-file=licenses.csv
          pip-licenses --format=plain
