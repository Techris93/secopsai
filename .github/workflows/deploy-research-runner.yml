name: Deploy Research Runner

# Manual only: the runner replaces the Render worker and must not start a
# second ledger writer by accident.  RUNNER_ENABLED stays "false" in
# wrangler.jsonc until the cutover checklist in the runner README is done.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secopsai-research-runner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Test runner Worker
        working-directory: cloudflare/secopsai-research-runner
        run: |
          npm run check
          npm test

      - name: Build image and deploy
        working-directory: cloudflare/secopsai-research-runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy
