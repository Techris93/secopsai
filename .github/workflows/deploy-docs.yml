name: Deploy Docs

# docs.secopsai.dev (Pages project "secopsai"). The Pages Git integration
# records each commit but does not rebuild MkDocs, so pushes to docs/ left the
# live documentation stale. Build strictly and deploy the output here.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/mkdocs_hooks/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secopsai-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Build documentation (strict)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
          mkdocs build --strict

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.114.0 pages deploy site \
            --project-name secopsai \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Deploy SecOpsAI docs ${GITHUB_SHA}"

      - name: Verify live documentation
        run: |
          set -euo pipefail
          sleep 10
          curl -fsS --retry 6 --retry-all-errors --retry-delay 5 https://docs.secopsai.dev/ -o "$RUNNER_TEMP/index.html"
          grep -q "SecOpsAI" "$RUNNER_TEMP/index.html"
          curl -fsS --retry 6 --retry-all-errors --retry-delay 5 https://docs.secopsai.dev/.well-known/security.txt | grep -q "^Contact:"
