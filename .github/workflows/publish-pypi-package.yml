name: Publish PyPI Package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate package without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-pypi-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-pypi-package:
    runs-on: ubuntu-latest
    env:
      TWINE_USERNAME: "__token__"
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - name: Checkout SecOpsAI
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Validate package
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: ${{ inputs.dry_run == false }}
        run: python -m twine upload dist/*

      - name: Dry-run summary
        if: ${{ inputs.dry_run != false }}
        run: |
          echo "Dry run completed. Re-run with dry_run=false after configuring PYPI_API_TOKEN to publish secopsai to PyPI."
