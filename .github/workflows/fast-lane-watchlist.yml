name: Fast Lane Watchlists

# Rebuilds the high-impact package watchlists the fast lane watches
# (npm-high-impact for npm, hugovk/top-pypi-packages for PyPI) and stores
# them in the ledger store. Dispatched daily by the ledger-store Worker.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LEDGER_STORE_URL: https://ledger.secopsai.dev
      LEDGER_STORE_TOKEN: ${{ secrets.LEDGER_STORE_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Build and upload watchlists
        run: python scripts/build_watchlists.py
