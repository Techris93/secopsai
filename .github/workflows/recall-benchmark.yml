name: Recall Benchmark

# Measures the rule funnel against known malware (Datadog Security Labs'
# malicious-software-packages-dataset, Apache-2.0) and against popular clean
# packages.  Samples are live malware: they are fetched only onto this
# disposable runner, decrypted and scanned in memory, never executed, and
# only rule ids, scores and file paths leave the job.

on:
  # Weekly regression check; fails (and notifies) when the false-positive
  # budget is exceeded.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      npm_samples:
        description: Malicious npm samples to draw
        default: "2000"
      pypi_samples:
        description: Malicious PyPI samples to draw
        default: "1000"
      clean_npm:
        description: Top npm packages for the false-positive set
        default: "1000"
      clean_pypi:
        description: Top PyPI packages for the false-positive set
        default: "500"
      seed:
        description: Sampling seed (keep fixed to compare rule changes)
        default: "20261010"
      rule_packs:
        description: Third-party rule packs (signature-base or yara-forge-extended)
        default: "signature-base"
      registry_samples:
        description: Malicious PyPI samples from lxyeternal/pypi_malregistry (0 skips the second corpus)
        default: "1000"

permissions:
  contents: read

concurrency:
  group: recall-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Pinned so results are comparable across rule changes; bump deliberately.
      DATASET_COMMIT: 805fcd72db525244cae8dd32056efbd50b8b0e19
      # Second corpus (about 10,000 malicious PyPI source archives) and the
      # OSV reports that date them for the held-out split.
      REGISTRY_COMMIT: b85fe7743597b850b72b0ac9cb815f88a301ef10
      OSV_COMMIT: bc8cbbb3cd85195939491aed42f3289b2f13d4d2
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch pinned YARA rule packs
        env:
          SECOPSAI_RULE_PACKS: ${{ inputs.rule_packs || 'signature-base' }}
        run: echo "SECOPSAI_YARA_RULE_DIRS=$(bash scripts/fetch_rule_packs.sh)" >> "$GITHUB_ENV"

      - name: Clone the dataset index (blobless, pinned)
        run: |
          git clone --quiet --filter=blob:none --no-checkout --sparse \
            https://github.com/DataDog/malicious-software-packages-dataset.git "$RUNNER_TEMP/malware-dataset"
          git -C "$RUNNER_TEMP/malware-dataset" checkout --quiet --detach "$DATASET_COMMIT"

      - name: Clone the second corpus and its OSV dates (blobless, pinned)
        if: ${{ (inputs.registry_samples || '1000') != '0' }}
        run: |
          git clone --quiet --filter=blob:none --no-checkout --sparse \
            https://github.com/lxyeternal/pypi_malregistry.git "$RUNNER_TEMP/malregistry"
          git -C "$RUNNER_TEMP/malregistry" checkout --quiet --detach "$REGISTRY_COMMIT"
          git clone --quiet --filter=blob:none --no-checkout --sparse \
            https://github.com/ossf/malicious-packages.git "$RUNNER_TEMP/ossf"
          git -C "$RUNNER_TEMP/ossf" sparse-checkout set osv/malicious/pypi
          git -C "$RUNNER_TEMP/ossf" checkout --quiet --detach "$OSV_COMMIT"
          echo "REGISTRY_ARGS=--registry $RUNNER_TEMP/malregistry --osv $RUNNER_TEMP/ossf/osv/malicious/pypi --registry-samples ${{ inputs.registry_samples || '1000' }}" >> "$GITHUB_ENV"

      - name: Run benchmark
        run: |
          python -I scripts/recall_benchmark.py \
            --dataset "$RUNNER_TEMP/malware-dataset" \
            --npm-samples "${{ inputs.npm_samples || '2000' }}" --pypi-samples "${{ inputs.pypi_samples || '1000' }}" \
            --clean-npm "${{ inputs.clean_npm || '1000' }}" --clean-pypi "${{ inputs.clean_pypi || '500' }}" \
            --seed "${{ inputs.seed || '20261010' }}" --fp-budget 0.5 --out "$RUNNER_TEMP/recall-benchmark.json" $REGISTRY_ARGS

      - name: Frontier scorecard
        if: always()
        env:
          SECOPSAI_CORE_BRIDGE_TOKEN: ${{ secrets.SECOPSAI_CORE_BRIDGE_TOKEN }}
          LEDGER_STORE_TOKEN: ${{ secrets.LEDGER_STORE_TOKEN }}
        run: |
          python scripts/frontier_scorecard.py --benchmark "$RUNNER_TEMP/recall-benchmark.json" \
            --out "$RUNNER_TEMP/frontier-scorecard.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recall-benchmark
          path: |
            ${{ runner.temp }}/recall-benchmark.json
            ${{ runner.temp }}/frontier-scorecard.json
          retention-days: 90

      - name: Remove samples
        if: always()
        run: rm -rf "$RUNNER_TEMP/malware-dataset" "$RUNNER_TEMP/malregistry" "$RUNNER_TEMP/ossf"
