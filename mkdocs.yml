site_name: SecOpsAI Documentation
site_url: https://docs.secopsai.dev/
site_description: Operator documentation for SecOpsAI network discovery, package-registry surveillance, findings triage, security research, reporting, and local-first integrations.
theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon-512.png
  logo: assets/header-mark.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: blue grey
  features:
    - navigation.top
    - navigation.instant
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

