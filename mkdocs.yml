site_name: secopsai
site_url: https://docs.secopsai.dev/
site_description: Local-first cross-platform SecOps for OpenClaw, macOS, Linux, and Windows
repo_url: https://github.com/Techris93/secopsai
repo_name: Techris93/secopsai

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon-512.png
  logo: assets/header-mark.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: green
      accent: green
  features:
    - navigation.top
    - navigation.instant
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Operator Runbook: operator-runbook.md
  - Findings Triage Guide: findings-triage-guide.md
  - Research And Verification: research-and-verification.md
  - Triage Orchestrator: triage-orchestrator.md
  - Adaptive Response Layer: adaptive-response.md
  - Rules Registry: rules-registry.md
  - Deployment Guide: deployment-guide.md
  - API Reference: api-reference.md
  - GitHub Distribution: github-distribution-plan.md
  - npm Name Migration: npm-name-migration.md
  - GitHub Marketplace: github-marketplace.md
  - Marketplace Listing: marketplace-listing.md
  - Threat Intel (IOCs): threat-intel.md
  - Threat Model: threat-model.md
  - Supply Chain Security: supply-chain.md
  - Beginner Live Guide: BEGINNER-LIVE-GUIDE.md
  - OpenClaw Integration: OpenClaw-Integration.md
  - OpenClaw Plugin: OpenClaw-Plugin.md
