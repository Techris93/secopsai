[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secopsai"
version = "1.0.0"
description = "Local-first security operations for networks, software supply chains, OpenClaw, Hermes Agent, and host telemetry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.139,<0.140",
  "psutil>=6,<7",
  "PyYAML>=6,<7",
  "requests>=2.33.1,<3",
  "feedparser>=6,<7",
  "defusedxml>=0.7,<1",
  "tomli>=2,<3; python_version < '3.11'",
  "uvicorn[standard]>=0.41,<0.52",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.25,<5",
  "pytest>=9.0.3,<10",
]
enterprise = [
  "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
secopsai = "secopsai.cli:main"

[tool.setuptools]
py-modules = [
  "cli",
  "confidence",
  "correlation",
  "detect",
  "evaluate",
  "evaluate_openclaw",
  "explain",
  "export_real_openclaw_native",
  "feedback",
  "findings",
  "generate_openclaw_attack_mix",
  "ingest_openclaw",
  "openclaw_findings",
  "openclaw_plugin",
  "openclaw_prepare",
  "prepare",
  "run_openclaw_live",
  "shadow",
  "soc_store",
  "swarm",
  "tune",
  "twilio_whatsapp_webhook",
  "whatsapp_openclaw_router",
]

[tool.setuptools.packages.find]
include = ["secopsai*", "openclaw_adapters*", "adapters*", "integrations*"]

[tool.setuptools.package-data]
"integrations.hermes" = ["plugin.yaml", "after-install.md", "README.md"]
