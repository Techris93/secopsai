services:
  - type: worker
    name: secopsai-research-worker
    runtime: python
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: python -u -m secopsai.cli research worker run --interval 60
    envVars:
      - key: SECOPSAI_CORE_ENVIRONMENT
        value: production
      - key: SECOPS_FINDINGS_DIR
        value: /var/data/secopsai-research
      - key: SECOPSAI_RESEARCH_ALERT_EMAIL
        value: research@secopsai.dev
      - key: SECOPSAI_RESEARCH_FROM_EMAIL
        value: research@secopsai.dev
      - key: SECOPSAI_EMAIL_LOGO_URL
        value: https://secopsai.dev/assets/favicon-512.png
      - key: SECOPSAI_EMAIL_PRODUCT_URL
        value: https://secopsai.dev/
      - key: SECOPSAI_RESEARCH_ALERT_MAX_ATTEMPTS
        value: "5"
      - key: SECOPSAI_SMTP_HOST
        value: smtp.resend.com
      - key: SECOPSAI_SMTP_PORT
        value: "465"
      - key: SECOPSAI_SMTP_USERNAME
        value: resend
      - key: SECOPSAI_RESEARCH_AUTO_ALERT_CHANNELS
        value: email,webhook
      # Source-backed campaign leads are sent only to the signed Core webhook.
      # They never inherit the operational email channel because one advisory
      # can name hundreds of affected package versions.
      - key: SECOPSAI_RESEARCH_EXTERNAL_ALERT_CHANNELS
        value: webhook
      # Exact-version npm enrichment is deliberately bounded per cycle.  New
      # release events remain queued when this budget is exhausted and resume
      # on the next worker cycle instead of being dropped.
      - key: SECOPSAI_NPM_ENRICHMENT_EVENT_LIMIT
        value: "100"
      - key: SECOPSAI_NPM_STATIC_ANALYSIS_LIMIT
        value: "10"
      - key: SECOPSAI_RESEARCH_ALERT_WEBHOOK_URL
        value: https://core.secopsai.dev/api/v1/research/alerts/webhook
      - key: SECOPSAI_RESEARCH_ALERT_WEBHOOK_SECRET
        sync: false
      - key: SECOPSAI_SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: SECOPSAI_STORAGE_RESERVE_BYTES
        value: "16777216"
      - key: SECOPSAI_STORAGE_MIN_FREE_BYTES
        value: "134217728"
      - key: SECOPSAI_STORAGE_MAX_USED_PERCENT
        value: "85"
      - key: SECOPSAI_RESEARCH_EVENT_RETENTION_HOURS
        value: "24"
      - key: SECOPSAI_RESEARCH_CANDIDATE_EVENT_RETENTION_DAYS
        value: "90"
      - key: SECOPSAI_RESEARCH_RUN_RETENTION_DAYS
        value: "30"
      - key: SECOPSAI_RESEARCH_NPM_ANALYSIS_RETENTION_DAYS
        value: "30"
      - key: SECOPSAI_RESEARCH_GAP_RETENTION_DAYS
        value: "180"
      - key: SECOPSAI_RESEARCH_DELIVERY_RETENTION_DAYS
        value: "90"
      - key: SECOPSAI_RESEARCH_SNAPSHOTS_PER_COLLECTOR
        value: "2"
    disk:
      name: secopsai-research-data
      mountPath: /var/data/secopsai-research
      sizeGB: 5
